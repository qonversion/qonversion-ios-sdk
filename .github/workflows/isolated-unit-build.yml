name: Isolated unit host build only

on:
  push:
    branches: [codex/ope722-unit-isolation]

permissions:
  contents: read

jobs:
  build-only:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/ope722-unit-isolation'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check source and build-only negative fixtures
        run: |
          python3 .github/scripts/test_unit_isolation.py
          python3 .github/scripts/test_unit_isolation_build.py
      - name: Prepare isolated OCMock and build without launching a host
        run: |
          python3 .github/scripts/unit_isolation_build.py \
            --expected-head '${{ github.sha }}' \
            --output "$RUNNER_TEMP/ope722-build-only"
      - name: Upload sanitized build-only verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-unit-build-only
          path: ${{ runner.temp }}/ope722-build-only/build-verdict.json
          if-no-files-found: error
          retention-days: 30
