name: Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  spm:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: SPM validation
        run: |
          swift build

  tests:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          swift test

  # The jobs above run on macOS, where everything wrapped in `#if os(iOS)`
  # compiles to nothing. That leaves the whole NoCodes presentation layer,
  # around 1700 lines, never built by CI, and files missing from the Xcode
  # target unnoticed.
  #
  # Every scheme is listed here: a source file that was never added to its
  # target still builds under SPM, which reads the file system, and only fails
  # under Xcode, which reads the target's file list.
  xcode:
    runs-on: macos-latest

    strategy:
      # Every scheme reports on its own, so one broken target does not hide
      # the state of the others.
      fail-fast: false
      matrix:
        scheme: [Qonversion, NoCodes, Sample]

    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.scheme }} iOS build
        run: |
          xcodebuild build -project Qonversion.xcodeproj -scheme ${{ matrix.scheme }} -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO
