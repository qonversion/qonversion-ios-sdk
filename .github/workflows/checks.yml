name: Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/checkout@v4
      
      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      
      - name: Validation
        run: |
          pod lib lint --verbose
  
  spm:
    name: SPM (${{ matrix.platform }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['iOS Simulator', 'macOS', 'tvOS Simulator', 'watchOS Simulator', 'visionOS Simulator']

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/checkout@v4
      # `swift build` compiles only the host (macOS) slice and silently skips every iOS-only code path
      # (NoCodes, UIKit, WebKit). Building the package through xcodebuild validates the real platform slices
      # exactly the way SPM consumers get them. The tracked `.swiftpm/xcode/package.xcworkspace` is what makes
      # xcodebuild build the *package*: without `-workspace`, `-scheme Qonversion` in the repo root silently
      # picks the framework target of Qonversion.xcodeproj instead.
      - name: SPM build (${{ matrix.platform }})
        run: |
          xcodebuild -workspace .swiftpm/xcode/package.xcworkspace \
            -scheme Qonversion \
            -destination 'generic/platform=${{ matrix.platform }}' \
            -skipPackagePluginValidation -skipMacroValidation \
            build CODE_SIGNING_ALLOWED=NO -quiet

  # Kids Mode as a Swift package: the `QonversionNoIdfa` product must ship without the `QonversionIDFA` target, so the
  # compiled code never mentions `ASIdentifierManager` (what App Review looks for in the Kids category), while the
  # default `Qonversion` product must still carry the IDFA reader. Checked on the compiled objects of each product.
  spm-noidfa:
    name: SPM products (IDFA vs NoIdfa)
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/checkout@v4
      - name: Build both products (iOS Simulator)
        run: |
          for scheme in Qonversion QonversionNoIdfa; do
            xcodebuild -workspace .swiftpm/xcode/package.xcworkspace \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "dd-$scheme" \
              -skipPackagePluginValidation -skipMacroValidation \
              build CODE_SIGNING_ALLOWED=NO -quiet
          done
      - name: QonversionNoIdfa carries no IDFA code
        run: |
          objects=$(find dd-QonversionNoIdfa -name '*.o' -path '*Objects-normal*')
          test -n "$objects" || { echo "::error::no compiled objects found for QonversionNoIdfa — derivedData layout changed?"; exit 1; }
          if find dd-QonversionNoIdfa -name 'QonversionIDFA.o' -o -name 'QNAdvertisingIdProvider.o' | grep -q .; then
            echo "::error::QonversionNoIdfa built the IDFA target"; exit 1
          fi
          # What App Review is known to look for in the Kids category: the class, the selector and the framework.
          hits=$(echo "$objects" | xargs strings | grep -c -E 'ASIdentifierManager|advertisingIdentifier|AdSupport' || true)
          if [ "$hits" -ne 0 ]; then
            echo "::error::QonversionNoIdfa references ASIdentifierManager / advertisingIdentifier / AdSupport ($hits occurrences)"; exit 1
          fi
      - name: Qonversion carries the IDFA reader
        run: |
          find dd-Qonversion -name 'QNAdvertisingIdProvider.o' | grep -q . || { echo "::error::Qonversion did not build QNAdvertisingIdProvider"; exit 1; }
          hits=$(find dd-Qonversion -name '*.o' -path '*Objects-normal*' | xargs strings | grep -c ASIdentifierManager || true)
          if [ "$hits" -eq 0 ]; then
            echo "::error::Qonversion does not reference ASIdentifierManager — the IDFA reader is missing"; exit 1
          fi
  
  common-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify API base URL
        run: |
          EXPECTED_URL="https://api2.qonversion.io/"

          MAIN_URL=$(grep 'kAPIBase = @"' Sources/Qonversion/Qonversion/Constants/QNAPIConstants/QNAPIConstants.m | sed 's/.*@"//;s/".*//')
          NOCODES_URL=$(grep 'baseURL = "' Sources/NoCodes/Assemblies/ServicesAssembly.swift | sed 's/.*= "//;s/".*//')

          FAILED=0

          if [ "$MAIN_URL" != "$EXPECTED_URL" ]; then
            echo "::error::Main API URL mismatch: expected '$EXPECTED_URL', got '$MAIN_URL'"
            FAILED=1
          fi

          if [ "$NOCODES_URL" != "$EXPECTED_URL" ]; then
            echo "::error::NoCodes API URL mismatch: expected '$EXPECTED_URL', got '$NOCODES_URL'"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "API URLs verified: $EXPECTED_URL"

  tests:
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/checkout@v4
      
      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      
      - name: Tests
        run: |
          fastlane tests
